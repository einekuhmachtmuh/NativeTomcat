name: migrate-pinned-socketwrapper

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'migrate: pinned SocketWrapperBase') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned Tomcat source
        run: |
          set -eu
          url='https://raw.githubusercontent.com/apache/tomcat/cbe6e15ee81e2fc6232954292a80cca5d1e84009/java/org/apache/tomcat/util/net/SocketWrapperBase.java'
          curl --fail --silent --show-error --location "$url" -o /tmp/SocketWrapperBase.java
          expected='98785b8974054dcf89ca39ef9bcdb2d787b3819d'
          actual="$(git hash-object /tmp/SocketWrapperBase.java)"
          test "$actual" = "$expected"
          mkdir -p java/org/apache/tomcat/util/net
          cp /tmp/SocketWrapperBase.java java/org/apache/tomcat/util/net/SocketWrapperBase.java
      - name: Commit exact source
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add java/org/apache/tomcat/util/net/SocketWrapperBase.java
          git diff --cached --quiet && exit 0
          git commit -m 'migrate: pinned SocketWrapperBase'
          git push
      - name: Remove one-shot migration workflow
        if: success()
        run: |
          set -eu
          git rm .github/workflows/migrate-pinned-socketwrapper.yml
          git commit -m 'chore: remove one-shot migration workflow'
          git push
